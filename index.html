<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0907">
  <title>Dutch Republic — Closed Indefinitely</title>
  <meta name="description" content="Dutch Republic is closed indefinitely.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 36%, rgba(214,163,74,.16), transparent 31rem),
        radial-gradient(circle at 22% 85%, rgba(214,163,74,.06), transparent 28rem),
        #0a0907;
      color: #f5f0e6;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: 62px 36px;
      text-align: center;
      position: relative;
    }
    main::before, main::after {
      content: "";
      position: absolute;
      left: 50%;
      width: min(460px, 78%);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, #d6a34a, transparent);
    }
    main::before { top: 22px; }
    main::after { bottom: 20px; }
    .mark {
      width: 104px;
      height: 104px;
      margin: 0 auto 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214,163,74,.62);
      border-radius: 50%;
      color: #d6a34a;
      font-size: 42px;
      line-height: 1;
      box-shadow: 0 0 42px rgba(214,163,74,.12), inset 0 0 32px rgba(214,163,74,.05);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 9vw, 4.2rem);
      font-weight: 700;
      letter-spacing: .035em;
      line-height: .98;
      text-transform: uppercase;
    }
    .rule {
      width: 56px;
      height: 2px;
      margin: 31px auto 27px;
      background: #d6a34a;
    }
    p {
      max-width: 480px;
      margin: 0 auto;
      color: rgba(245,240,230,.86);
      font-size: clamp(1.1rem, 3.2vw, 1.3rem);
      font-style: italic;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Dutch Republic">✦</div>
    <h1>Closed<br>Indefinitely</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Thank you to everyone who supported us.</p>
  </main>
</body>
</html>
